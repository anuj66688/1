<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Language Library & Catalogue — CodeAtlas</title>
  <meta name="description" content="Browse programming languages by history, domain, and ecosystem in the CodeAtlas language catalogue." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305070D' stroke='%2300F0FF' stroke-width='3'/%3E%3Ctext x='50%25' y='54%25' text-anchor='middle' dominant-baseline='middle' fill='%2300F0FF' font-family='monospace' font-weight='bold' font-size='24'%3E%26lt;/%26gt;%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-initial-view="languages">
  <header class="ca-navbar" role="banner">
    <div class="ca-navbar-inner">
      <a href="index.html" class="ca-brand"><span class="ca-brand-mark">&lt;/&gt;</span><span>Code<span class="ca-brand-atlas">Atlas</span></span></a>
      <nav aria-label="Primary Navigation">
        <ul class="ca-nav-links">
          <li><a href="index.html" class="ca-nav-link">Home</a></li>
          <li><a href="atlas.html" class="ca-nav-link">Atlas</a></li>
          <li><a href="languages.html" class="ca-nav-link active">Languages</a></li>
          <li><a href="timeline.html" class="ca-nav-link">Timeline</a></li>
          <li><a href="compare.html" class="ca-nav-link">Compare</a></li>
          <li><a href="explore.html" class="ca-nav-link">Explore</a></li>
          <li><a href="quiz.html" class="ca-nav-link">Quiz</a></li>
        </ul>
      </nav>
      <div class="ca-nav-actions ca-nav-actions-desktop" data-auth-slot></div>
    </div>
  </header>

  <main id="view-languages" class="ca-view active">
    <div class="ca-container" style="padding-top:3rem;padding-bottom:5rem;">
      <div style="margin-bottom:2.25rem;">
        <div class="eyebrow" style="margin-bottom:0.5rem;">CATALOGUE INDEX</div>
        <h1 style="font-size:clamp(2rem,3.5vw,3rem);font-weight:800;margin-bottom:0.5rem;">Language library.</h1>
        <p style="color:var(--text-secondary);font-size:1.05rem;">Browse programming languages by history, domain, and ecosystem.</p>
      </div>
      <div class="ca-card" style="padding:1.25rem;margin-bottom:2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;">
        <div class="ca-input-wrap" style="flex:1;min-width:260px;">
          <svg class="ca-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="search" id="languages-search-input" class="ca-input" placeholder="Search by language name, year, paradigm, or use case..." />
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:0.45rem;">
          <button type="button" class="filter-pill active" data-lib-cat="All">All</button>
          <button type="button" class="filter-pill" data-lib-cat="AI & Data">AI &amp; Data</button>
          <button type="button" class="filter-pill" data-lib-cat="Web">Web</button>
          <button type="button" class="filter-pill" data-lib-cat="Systems">Systems</button>
          <button type="button" class="filter-pill" data-lib-cat="Enterprise">Enterprise</button>
          <button type="button" class="filter-pill" data-lib-cat="Mobile">Mobile</button>
          <button type="button" class="filter-pill" data-lib-cat="Data">Data</button>
        </div>
      </div>
      <div id="languages-count-label" class="font-mono" style="font-size:0.78rem;color:var(--text-muted);margin-bottom:1.25rem;">Showing 16 of 16 languages</div>
      <div id="languages-library-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:1.35rem;"></div>
      <div id="languages-empty-state" class="ca-card" style="display:none;text-align:center;padding:3.5rem 1.5rem;">
        <h3 style="font-size:1.5rem;font-weight:700;margin-bottom:0.5rem;">No language found</h3>
        <button type="button" id="btn-reset-languages-filter" class="btn btn-primary btn-sm">Reset Search &amp; Filters</button>
      </div>
    </div>
  </main>

  <section id="view-lang-profile" class="ca-view">
    <div class="ca-container" style="padding-top:2.5rem;padding-bottom:5rem;" id="lang-profile-container"></div>
  </section>

  <script src="js/data.js"></script>
  <script src="js/atlas.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
